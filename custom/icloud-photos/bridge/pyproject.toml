[project]
name = "icloud-photos-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pyicloud==2026.11.2",   # pinned: Apple changes break things; bump deliberately
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pysocks>=1.7",          # socks5h egress via the hkdis tunnel
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
icloud-bridge = "icloud_bridge.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["icloud_bridge"]
